<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sheets Style - Loyihalar Nazorati</title>
    <link rel="stylesheet" href="./assets/css/index.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Login va Ro'yxatdan o'tish Modal Oynasi -->
    <!-- Headr qismidagi logo-area ni shunga almashtiring -->

    <!-- Modal ichidagi auth-form qismini shunga almashtiring -->
    <!-- Login va Ro'yxatdan o'tish Modal Oynasi -->
    <div id="authModal" class="modal-overlay">
        <div class="modal-card">
            <h2 id="modalTitle">Tizimga kirish</h2>
            <p id="modalDesc">Loyihalaringizni boshqarish uchun elektron pochta va parolingizni kiriting:</p>
            
            <div class="auth-form">
                <input type="email" id="authEmail" placeholder="Email manzil..." autocomplete="off">
                <div class="password-container">
                    <input type="password" id="authPassword" placeholder="Parol (kamida 6 ta belgi)..." autocomplete="off">
                    <button type="button" id="togglePasswordBtn" class="toggle-password-btn">👁️</button>
                </div>
                <button id="authActionBtn" class="btn-primary">Kirish</button>
            </div>
            
            <div class="auth-switch">
                <span id="switchText">Akkauntingiz yo'qmi?</span> 
                <a href="#" id="switchAuthMode">Ro'yxatdan o'tish</a>
            </div>
        </div>
    </div>
    <!-- Kirish va Xona o'zgartirish Modal Oynasi -->
    <!-- <div id="roomModal" class="modal-overlay">
        <div class="modal-card">
            <h2>Xona / Ism kiriting</h2>
            <p>Ma'lumotlaringiz boshqalarnikidan alohida saqlanishi uchun xona nomi yoki ismingizni yozing:</p>
            <div class="modal-input-group">
                <input type="text" id="roomInput" placeholder="Masalan: maktab_odil" autocomplete="off">
                <button id="joinRoomBtn" class="btn-primary">Kirish</button>
            </div>
        </div>
    </div> -->

    <div class="app-container">
        <!-- Yuqori qism: Sinflar tablari va Joriy xona -->
        <header class="header">
            <div class="logo-area">
                <div class="logo">📊 Loyihalar Nazorati</div>
                <div class="current-room-badge" id="currentUserDisplay" title="Hisobdan chiqish uchun bosing"
                    onclick="logoutUser()">Yuklanmoqda...</div>
            </div>
            <div class="grades-nav" id="gradesNav">
                <button class="grade-btn active" data-grade="7">7-sinf</button>
                <button class="grade-btn" data-grade="8">8-sinf</button>
                <button class="grade-btn" data-grade="9">9-sinf</button>
                <button class="grade-btn" data-grade="10">10-sinf</button>
                <button class="grade-btn" data-grade="11">11-sinf</button>
            </div>
        </header>

        <!-- Boshqaruv paneli -->
        <!-- Boshqaruv paneli -->
        <div class="toolbar">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="Qidirish..." autocomplete="off">
            </div>

            <div class="filter-box">
                <select id="filterSelect">
                    <option value="default">Holat: Hammasi</option>
                    <option value="not_done_first">Holat: Bajarmaganlar oldinda</option>
                    <option value="done_first">Holat: Bajarilganlar oldinda</option>
                    <option value="az">Alifbo bo'yicha (A-Z)</option>
                    <option value="za">Alifbo bo'yicha (Z-A)</option>
                </select>
            </div>

            <div class="toolbar-inputs-group">
                <input type="text" id="studentNameInput" placeholder="O'quvchi F.I.Sh. kiriting..." autocomplete="off">
                <div class="toolbar-btns">
                    <button id="addStudentBtn" class="btn-primary">+ O'quvchi qo'shish</button>
                    <button id="addColumnBtn" class="btn-secondary">+ Ustun qo'shish</button>
                </div>
            </div>
        </div>

        <!-- Google Sheets uslubidagi keng jadval -->
        <div class="spreadsheet-container">
            <table id="spreadsheetTable">
                <thead>
                    <tr id="tableHeaderRow">
                        <th class="row-number-header">#</th>
                        <th class="name-col-header">O'quvchi F.I.Sh.</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr class="empty-row">
                        <td colspan="2">Ma'lumotlar yuklanmoqda...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="./assets/js/index.js" type="module"></script>
</body>

</html>
